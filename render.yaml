# BLUE FISH PRIME — candle viewer (online, read-only).
# Push this folder to GitHub, then in Render: New -> Web Service -> pick the repo.
# Set DATABASE_URL in the Dashboard (see README_BN.md) — it is NOT in this file.
# The viewer only reads the candles table; it never writes to the DB.
services:
  - type: web
    name: blue-fish-candle-viewer
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python view_candles.py
    envVars:
      - key: DATABASE_URL
        sync: false
      # Optional password protection: set any password you choose here
      # in the Render Dashboard (never put it in this file or GitHub).
      # When set, the viewer asks for it on every page/API request.
      - key: VIEWER_PASSWORD
        sync: false
